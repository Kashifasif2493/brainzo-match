name: Unzip upload
on:
  push:
    paths:
      - 'BrainzoMatch_upload.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip
        run: |
          unzip -o BrainzoMatch_upload.zip
          rm BrainzoMatch_upload.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add project files from zip"
          git push
